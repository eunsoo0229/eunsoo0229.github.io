apply plugin: 'com.android.application'

def localLlmEnabled = (project.findProperty('martialdexLocalLlm') ?: 'true') != 'false'
def localLlmAbis = ((project.findProperty('localLlmAbis') ?: 'arm64-v8a,x86_64') as String).split(',').collect { it.trim() }

android {
    namespace = "com.martialdex.testbuild"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.martialdex.testbuild"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 로컬 AI 엔진 (LocalLlmPlugin → src/main/cpp → llama.cpp): arm64 phones; x86_64 only for the emulator.
        //   -PmartialdexLocalLlm=false  builds WITHOUT the engine (performance baseline / fallback; the plugin
        //                               then reports the device as unsupported)
        //   -PlocalLlmAbis=arm64-v8a    phones only (drops the emulator's x86_64 libraries, ~20MB smaller)
        if (localLlmEnabled) {
            ndk {
                abiFilters(*localLlmAbis)
            }
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release',
                            '-DBUILD_SHARED_LIBS=ON',
                            '-DLLAMA_BUILD_COMMON=ON',
                            '-DLLAMA_BUILD_TESTS=OFF',
                            '-DLLAMA_BUILD_EXAMPLES=OFF',
                            '-DLLAMA_BUILD_TOOLS=OFF',
                            '-DLLAMA_BUILD_SERVER=OFF',
                            '-DLLAMA_BUILD_APP=OFF',
                            '-DLLAMA_OPENSSL=OFF',
                            '-DLLAMA_CURL=OFF',
                            '-DGGML_NATIVE=OFF',
                            '-DGGML_BACKEND_DL=ON',
                            '-DGGML_CPU_ALL_VARIANTS=ON',
                            '-DGGML_LLAMAFILE=OFF'
                }
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    ndkVersion = "28.2.13676358"
    if (localLlmEnabled) {
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
                version "3.31.6"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // BackgroundRecordingService/SparringCameraPlugin — CameraX for real
    // camera-hardware capture from a foreground Service (unlike the WebView's
    // getUserMedia(), this keeps running when the app is backgrounded/screen
    // is off). LifecycleService lets a plain Service satisfy CameraX's
    // LifecycleOwner requirement without needing an Activity.
    def cameraxVersion = "1.3.4"
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-video:$cameraxVersion"
    implementation "androidx.lifecycle:lifecycle-service:2.8.7"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
