# MARTIALDEX self-hosted SearXNG — local only (127.0.0.1). Secret comes from
# the SEARXNG_SECRET environment variable (services/searxng/run.sh), never this file.
use_default_settings: true

general:
  instance_name: "MARTIALDEX Search"
  enable_metrics: true

server:
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  formats:
    - html
    - json
  languages:
    - all
    - ko
    - en

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 20
  pool_maxsize: 10

# Engines measured on 2026-10-31 (.devtools/bench-searxng-engines.mjs,
# data/audit/self-ai/searxng-engines-*.json). Engines that answered with
# CAPTCHA / access denied are disabled rather than worked around.
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: naver
    disabled: false
  - name: mojeek
    disabled: true
  - name: crossref
    disabled: false
  - name: google
    disabled: true
  - name: google videos
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: qwant
    disabled: true
  - name: startpage
    disabled: true
